<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 자산</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5a0f17">
<meta name="mobile-web-app-capable" content="yes">
<style>
  html,body{margin:0;height:100%;background:#5a0f17;color:#fff4f4;font-family:system-ui,sans-serif}
  .c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  img{width:96px;height:96px;border-radius:22px}
  a{color:#e8c27a;font-size:14px}
</style>
</head>
<body>
<div class="c">
  <img src="icon-192.png" alt="">
  <div>금고 여는 중…</div>
  <a id="go" href="#">안 열리면 여기를 눌러줘</a>
</div>
<script>
  // 홈 화면 아이콘용 바로가기 페이지: 열자마자 '내 자산' 웹 앱으로 이동
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxIsjeb0QVAJc3xzS2kWMhPlWHU9ZPpkq5kV0xbcLq2cjCbffRk7POCNZe7bCJVlOBs/exec';
  if (APP_URL.indexOf('https://script.google.com/') === 0) {
    document.getElementById('go').href = APP_URL;
    setTimeout(function () { location.replace(APP_URL); }, 150);
  } else {
    document.querySelector('.c div').textContent = '앱 주소를 설정하는 중이에요';
    document.getElementById('go').hidden = true;
  }
</script>
</body>
</html>
